# Default pipeline configuration
# Override via CLI args or environment variables

dataset:
  vindr_root: "${VINDR_ROOT}"
  images_subdir: "images"
  annotations: "finding_annotations.csv"

sampling:
  n_with_lesion: 40
  n_without_lesion: 10
  seed: 2024
  strategy: "stratified"  # stratified | random | one_per_study

pipeline:
  patch_size: 96
  buffer_px: 20
  save_degraded_qc: false

# All severity levels (1–6) mirror SEVERITY_PRESETS in src/roi_metrics.py.
# Severity 0 = baseline (no degradation).
degradations:
  # Dose-based Gaussian noise.
  # dose_factor = fraction of original dose; lower → more noise.
  # additional_std = sqrt(max(target_std² - baseline_std², 0))
  # where target_std = baseline_std / sqrt(dose_factor).
  noise:
    - {severity: 1, dose_factor: 0.95}
    - {severity: 2, dose_factor: 0.85}
    - {severity: 3, dose_factor: 0.75}
    - {severity: 4, dose_factor: 0.65}
    - {severity: 5, dose_factor: 0.50}
    - {severity: 6, dose_factor: 0.35}

  # Horizontal motion blur, given directly as odd kernel lengths in pixels.
  # A mm-first schedule collapses at the sub-0.1 mm pixel spacings of this
  # dataset, so the length is fixed in pixels instead. At the median 0.240 mm
  # per canvas pixel these correspond to extents of 0.72, 1.20, 1.68, 2.64,
  # 3.60 and 5.04 mm in the patient plane.
  motion_blur:
    - {severity: 1, length_px:  3, angle: 0.0}
    - {severity: 2, length_px:  5, angle: 0.0}
    - {severity: 3, length_px:  7, angle: 0.0}
    - {severity: 4, length_px: 11, angle: 0.0}
    - {severity: 5, length_px: 15, angle: 0.0}
    - {severity: 6, length_px: 21, angle: 0.0}

  # Linear contrast reduction centered on masked tissue median.
  # x_out = alpha * (x_in - center) + center
  contrast:
    - {severity: 1, alpha: 0.95}
    - {severity: 2, alpha: 0.90}
    - {severity: 3, alpha: 0.85}
    - {severity: 4, alpha: 0.80}
    - {severity: 5, alpha: 0.75}
    - {severity: 6, alpha: 0.70}

  # JPEG 2000 lossy wavelet compression.
  # compression_ratio = target_size / original_size (higher = more lossy).
  # CR=10 is clinically acceptable; CR=500 causes severe detail loss.
  jpeg2000:
    - {severity: 1, compression_ratio:  10}
    - {severity: 2, compression_ratio:  25}
    - {severity: 3, compression_ratio:  50}
    - {severity: 4, compression_ratio: 100}
    - {severity: 5, compression_ratio: 250}
    - {severity: 6, compression_ratio: 500}

  # Spatial resolution loss via downscale (INTER_AREA) + upscale (INTER_CUBIC).
  # scale_factor = downscale fraction; lower = stronger blurring.
  resolution:
    - {severity: 1, scale_factor: 0.90}
    - {severity: 2, scale_factor: 0.80}
    - {severity: 3, scale_factor: 0.70}
    - {severity: 4, scale_factor: 0.60}
    - {severity: 5, scale_factor: 0.50}
    - {severity: 6, scale_factor: 0.40}
